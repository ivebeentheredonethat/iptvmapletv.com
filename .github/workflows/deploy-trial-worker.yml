name: Deploy trial worker

# Deploys worker/worker.js as the iptv-trial-iptvmapletv Worker (same setup as the other sites'
# trial workers): TRIALS KV binding and workers.dev URL. The hourly reminder / follow-up run comes from
# trial-followups.yml. Secrets (RESEND_KEY, PANEL_API_KEY) are set on the Worker in Cloudflare and are
# kept across deploys.

on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/deploy-trial-worker.yml']
  pull_request:
    paths: ['worker/**', '.github/workflows/deploy-trial-worker.yml']
  workflow_dispatch:

concurrency:
  group: trial-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER: iptv-trial-iptvmapletv
      API: https://api.cloudflare.com/client/v4/accounts
    steps:
      - uses: actions/checkout@v4

      - name: Check syntax
        run: node --check worker/worker.js

      - name: Upload worker
        run: |
          METADATA='{"main_module":"worker.js","compatibility_date":"2024-01-01","keep_bindings":["secret_text"],"observability":{"enabled":true},
            "bindings":[{"type":"kv_namespace","name":"TRIALS","namespace_id":"6741b6342df744e98b14033ff1598c0f"}]}'
          curl -sS -X PUT "$API/$CF_ACCOUNT/workers/scripts/$WORKER" -H "Authorization: Bearer $CF_TOKEN" \
            -F "metadata=$METADATA;type=application/json" \
            -F "worker.js=@worker/worker.js;type=application/javascript+module" > result.json
          python3 -c "import json,sys; d=json.load(open('result.json')); print('Deployed' if d.get('success') else d.get('errors')); sys.exit(0 if d.get('success') else 1)"

      - name: Enable workers.dev URL
        run: |
          curl -sS -X POST "$API/$CF_ACCOUNT/workers/scripts/$WORKER/subdomain" -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" -d '{"enabled":true}' | python3 -c "import sys,json; print('Subdomain:', json.load(sys.stdin).get('success'))"

      - name: Try a cron trigger (optional)
        # The account is at the Workers Free limit of 5 cron triggers; trial-followups.yml covers it.
        run: |
          curl -sS -X PUT "$API/$CF_ACCOUNT/workers/scripts/$WORKER/schedules" -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" -d '[{"cron":"0 * * * *"}]' > cron.json
          python3 -c "import json; d=json.load(open('cron.json')); print('Cron trigger:', 'set' if d.get('success') else 'not available (%s); follow-ups run from trial-followups.yml' % (d.get('errors') or [{}])[0].get('message'))"

      - name: Status (secret names only, never values)
        run: |
          curl -sS "$API/$CF_ACCOUNT/workers/scripts/$WORKER/secrets" -H "Authorization: Bearer $CF_TOKEN" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print('Worker secrets:', [s['name'] for s in d.get('result') or []])"
          sleep 5
          curl -sS -m 30 "https://$WORKER.medmaar.workers.dev/?debug=1" || true
